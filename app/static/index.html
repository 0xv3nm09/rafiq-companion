<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafiq — Employee AI Companion</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="app">

  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">ر</div>
      <div>
        <div class="brand-name">Rafiq</div>
        <div class="brand-sub t-en">Employee AI Companion</div>
        <div class="brand-sub t-ar">رفيق — رفيق الموظف الذكي</div>
      </div>
    </div>

    <label class="field">
      <span class="field-label t-en">Viewing as</span><span class="field-label t-ar">تتصفح باسم</span>
      <select id="employee-select"></select>
    </label>

    <div class="stage-card" id="stage-card">
      <div class="stage-label t-en">Current stage</div>
      <div class="stage-label t-ar">المرحلة الحالية</div>
      <div class="stage-value" id="stage-value">—</div>
      <div class="stage-meta" id="stage-meta"></div>
    </div>

    <nav class="tabs" id="rail-tabs">
      <button class="tab is-active" data-tab="timeline"><span class="t-en">Journey</span><span class="t-ar">الرحلة</span></button>
      <button class="tab" data-tab="data"><span class="t-en">My data</span><span class="t-ar">بياناتي</span></button>
      <button class="tab" data-tab="audit"><span class="t-en">Audit log</span><span class="t-ar">سجل النشاط</span></button>
      <button class="tab" data-tab="notices"><span class="t-en">Notices</span><span class="t-ar">التنبيهات</span><span class="badge" id="notice-badge" hidden></span></button>
    </nav>

    <div class="rail-foot">
      <button id="sweep-btn" class="ghost-btn"><span class="t-en">Simulate proactive sweep</span><span class="t-ar">محاكاة الفحص الاستباقي</span></button>
      <div class="consent-mini">
        <span class="t-en">Pulse consent</span><span class="t-ar">موافقة نبضات الرأي</span>
        <label class="switch"><input type="checkbox" id="consent-toggle"><span class="slider"></span></label>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="chat-title">
        <span class="t-en">Talk to Rafiq</span><span class="t-ar">تحدث مع رفيق</span>
      </div>
      <div class="lang-toggle" id="lang-toggle" role="switch" aria-checked="false" tabindex="0">
        <span class="lang-opt is-active" data-lang="en">EN</span>
        <span class="lang-opt" data-lang="ar">ع</span>
      </div>
    </header>

    <div class="chips" id="chips">
      <button class="chip" data-msg="Where is my laptop?"><span class="t-en">Where is my laptop?</span><span class="t-ar">وين حاسوبي؟</span></button>
      <button class="chip" data-msg="What is my status?"><span class="t-en">My status</span><span class="t-ar">حالتي</span></button>
      <button class="chip" data-msg="Book my medical fitness test"><span class="t-en">Book medical</span><span class="t-ar">احجز الفحص الطبي</span></button>
      <button class="chip" data-msg="How many annual leave days do I get?"><span class="t-en">Annual leave?</span><span class="t-ar">رصيد الإجازات؟</span></button>
    </div>

    <div class="thread" id="thread" aria-live="polite"></div>

    <form class="composer" id="composer">
      <input id="msg-input" autocomplete="off"
             placeholder-en="Ask about your journey, a policy, or a request…"
             placeholder-ar="اسأل عن رحلتك أو سياسة أو اطلب خدمة…">
      <button type="submit" class="send-btn" aria-label="Send"><span class="t-en">Send</span><span class="t-ar">إرسال</span></button>
    </form>
  </main>

  <section class="panel" id="panel"></section>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
